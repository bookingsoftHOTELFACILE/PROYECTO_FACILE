name: CI – BookingSoft

on:
  push:
    branches: ["main", "develop", "feature/*", "fix/*"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test-backend:
    name: 🐍 Pytest + Auditoría Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bookingsoft_test
          POSTGRES_USER: adso_user
          POSTGRES_PASSWORD: adso_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: bookingsoft_test
      DB_USER: adso_user
      DB_PASSWORD: adso_password
      JWT_SECRET: ci_secret_seguro_bookingsoft_2026_test
      RESET_DB: "true"

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Instalar Pipenv y dependencias
        working-directory: backend
        run: |
          pip install --upgrade pip pipenv
          pipenv install --system --skip-lock --dev

      - name: 🧪 Ejecutar suite de pruebas (pytest)
        working-directory: backend
        run: pytest --tb=short -v

      - name: 🔍 Auditoría de seguridad (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --requirement <(pipenv requirements) --desc on || true

  test-frontend:
    name: ⚛️ Vitest + Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: 🧪 Ejecutar pruebas unitarias (Vitest)
        working-directory: frontend
        run: npm test -- --run

      - name: 🏗️ Validar compilación de producción (Vite)
        working-directory: frontend
        run: npm run build

      - name: 🔍 Auditoría de dependencias
        working-directory: frontend
        run: npm audit --audit-level moderate || true

  test-e2e:
    name: 🎭 Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐳 Iniciar infraestructura con Docker Compose
        run: |
          docker compose up -d --build db backend frontend
          timeout 60 bash -c 'until docker compose ps | grep -E "bookingsoft-frontend.*(healthy|running|Up)"; do sleep 2; done'
          docker compose ps

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 📦 Instalar dependencias Playwright
        working-directory: E2E
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: 🎭 Ejecutar suite E2E
        working-directory: E2E
        env:
          BASE_URL: http://localhost:3001
          CI: "true"
        run: npx playwright test

      - name: 📤 Subir reporte Playwright en caso de fallo
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: E2E/playwright-report/
          retention-days: 7
